# Configuración de NEAT-Python 2.0 para la P2 (seguidor Robobo).
# num_inputs DEBE coincidir con las entradas de p2_neat.py (ENTRADAS[2], 6)
# y num_outputs con la acción (v, w). p2_neat.py copia este archivo a la
# carpeta de cada evolución, sustituyendo la semilla.
#
# Cambios respecto al punto de partida de las indicaciones técnicas (se
# justifican en la memoria):
#   bias_init_stdev 1.0 -> 0.3 y bias_mutate_power 0.5 -> 0.3: la tanh de
#     NEAT es tanh(2,5 z). Con las entradas a ~0 en régimen, una red nueva
#     da tanh(2,5 * sesgo): con desviación 1 el 77 % de la población inicial
#     giraba a más de 0,4 rad/s con la pelota centrada (la pierde en 1-2 s).
#     Con 0,3, el 35 %. La acción útil en C1 es pequeña (v ~ 0,05 m/s,
#     |w| < 0,15 rad/s), así que los pasos de mutación del sesgo también.
#   compatibility_threshold 3.0 -> 1.3: con 20 individuos y 6 entradas, 3.0
#     deja una única especie; en las primeras evoluciones 1.0 dio 6-7
#     especies de 2-3 individuos y 1.8 sólo 2-4. Objetivo: 3-5 especies (se
#     vigila en especies.csv). En la generación 0 hay siempre una sola,
#     porque todas las redes tienen la misma topología.
#   max_stagnation 8 -> 20 y species_elitism 1 -> 2: en C1 la mejor especie
#     llega a ~98 (techo 100) hacia la generación 9 y ya no puede mejorar su
#     máximo. Con max_stagnation 10 (C1_v2_s1_rescate) NEAT la declaró
#     estancada y la eliminó en la generación 20: species_elitism 1 sólo
#     protegía a la especie con mejor calidad en esa generación, y por el
#     ruido de un único episodio era otra (80,8 frente a 74,3). La
#     población se quedó con las especies mediocres (F ~ 14) y el mejor
#     cayó de ~97 a 14. Con 20 la eliminación por estancamiento casi no
#     actúa en evoluciones de 20-25 generaciones, y se protegen las 2 mejores.

[NEAT]
fitness_criterion = max
fitness_threshold = 100.0
no_fitness_termination = True
pop_size = 20
reset_on_extinction = True
seed = 1

[DefaultGenome]
num_inputs = 6
num_hidden = 0
num_outputs = 2
feed_forward = True
initial_connection = full_direct
activation_default = tanh
activation_mutate_rate = 0.0
activation_options = tanh
aggregation_default = sum
aggregation_mutate_rate = 0.0
aggregation_options = sum
bias_init_mean = 0.0
bias_init_stdev = 0.3
bias_max_value = 5.0
bias_min_value = -5.0
bias_mutate_power = 0.3
bias_mutate_rate = 0.7
bias_replace_rate = 0.1
response_init_mean = 1.0
response_init_stdev = 0.0
response_max_value = 5.0
response_min_value = -5.0
response_mutate_power = 0.0
response_mutate_rate = 0.0
response_replace_rate = 0.0
weight_init_mean = 0.0
weight_init_stdev = 1.0
weight_max_value = 5.0
weight_min_value = -5.0
weight_mutate_power = 0.5
weight_mutate_rate = 0.8
weight_replace_rate = 0.1
enabled_default = True
enabled_mutate_rate = 0.01
conn_add_prob = 0.3
conn_delete_prob = 0.1
node_add_prob = 0.1
node_delete_prob = 0.05
compatibility_disjoint_coefficient = 1.0
compatibility_weight_coefficient = 0.5

[DefaultSpeciesSet]
compatibility_threshold = 1.3

[DefaultStagnation]
species_fitness_func = max
max_stagnation = 20
species_elitism = 2

[DefaultReproduction]
elitism = 2
survival_threshold = 0.3
min_species_size = 2
